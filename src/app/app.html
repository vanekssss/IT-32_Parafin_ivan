<div class="container">

  <header>
    <h1>Каталог фільмів</h1>
    <p>Додай свої улюблені фільми до каталогу</p>
  </header>

  <section class="form-section">
    <h2>Додати фільм</h2>

    <div class="form">

      <div class="field">
        <label for="title">Назва фільму</label>
        <input
          id="title"
          type="text"
          placeholder="Назва"
          [(ngModel)]="title"
          name="title"
        >
      </div>

      <div class="field">
        <label for="year">Рік</label>
        <input
          id="year"
          type="number"
          placeholder="2024"
          [(ngModel)]="year"
          name="year"
        >
      </div>

      <div class="field">
        <label for="rating">Рейтинг</label>
        <input
          id="rating"
          type="number"
          min="0"
          max="10"
          step="0.1"
          placeholder="9"
          [(ngModel)]="rating"
          name="rating"
        >
      </div>

    </div>

    <button class="add-button" (click)="addItem()">
      Додати фільм
    </button>
  </section>

  <section>
    <h2>Список фільмів</h2>

    <div class="movies">

      <div class="movie" *ngFor="let item of getItems()">

        <div class="movie-number">
          #{{ item.id }}
        </div>

        <h3>{{ item.title }}</h3>

        <p>Рік: {{ item.year }}</p>

        <div class="rating">
          ★ {{ item.rating }} / 10
        </div>

        <button
          class="delete-button"
          (click)="removeItem(item.id)"
        >
          Видалити
        </button>

      </div>

    </div>
  </section>

</div>
